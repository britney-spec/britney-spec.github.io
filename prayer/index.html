    animation:drift-bg 42s ease-in-out infinite alternate;
  }
  @keyframes drift-bg{
    from{ transform:scale(1) translate(0,0); }
    to{ transform:scale(1.07) translate(-1.2%,-1%); }
  }
  .bg::after{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 50% 50%, transparent 42%, rgba(15,19,30,0.16) 72%, rgba(11,14,23,0.4) 100%),
      linear-gradient(180deg, rgba(14,18,29,0.5) 0%, rgba(14,18,29,0.08) 22%, rgba(14,18,29,0.04) 55%, rgba(12,15,25,0.32) 78%, rgba(10,13,21,0.82) 100%);
  }
  .grain{
    position:absolute; inset:0; z-index:2;
    opacity:.05; mix-blend-mode:overlay; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .motes{position:absolute; inset:0; overflow:hidden; mix-blend-mode:screen; opacity:.45; z-index:1;}
  .mote{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(243,227,184,0.95), rgba(243,227,184,0) 70%);
    filter:blur(0.5px);
    animation:drift linear infinite;
  }
  @keyframes drift{
    from{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.85; }
    90%{ opacity:.45; }
    to{ transform:translateY(-120%) translateX(var(--dx,0)); opacity:0; }
  }

  /* ---------- kicker ---------- */
  .kicker{
    position:absolute; top:0; left:0; right:0; z-index:5;
    padding:calc(env(safe-area-inset-top,0px) + 24px) 24px 0;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'Cormorant Garamond',serif;
  }
  .kicker .label{
    font-size:12px; letter-spacing:.26em; text-transform:uppercase;
    color:var(--gold-soft); opacity:.9;
  }
  .sparkle{
    position:relative; width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .sparkle svg{
    width:100%; height:100%;
    animation:twinkle 2.8s ease-in-out infinite;
    transform-origin:center;
    filter:blur(2.1px);
    opacity:.9;
  }
  .sparkle .ray{
    position:absolute; inset:-11px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(243,227,184,0.75), rgba(243,227,184,0.18) 55%, transparent 75%);
    filter:blur(1.5px);
    animation:glow-pulse 2.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:.6; transform:scale(.8) rotate(-6deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(6deg); }
  }
  @keyframes glow-pulse{
    0%, 100%{ opacity:.25; transform:scale(.7); }
    50%{ opacity:.8; transform:scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce){
    .sparkle svg, .sparkle .ray, .bg{ animation:none !important; }
  }

  /* ---------- sentence stage ---------- */
  .lines{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:0 32px;
    transform:translateY(-8%);
    z-index:4;
  }
  .line{
    position:absolute;
    text-align:center;
    max-width:310px;
    opacity:0;
    will-change:opacity, transform, filter;
    animation-name:pulse;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .stage.paused .line{ animation-play-state:paused; }
  /* @keyframes pulse is generated at runtime (script below) because the
     fade in/hold/fade-out offsets depend on the sentence count. */

  .line .glow{
    position:absolute; left:50%; top:50%;
    width:280px; height:170px;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(10,12,20,0.34), transparent 72%);
    z-index:-1;
  }
  .line .zh{
    display:block;
    font-family:'Noto Serif TC',serif;
    font-weight:600;
    font-size:23px;
    line-height:1.72;
    letter-spacing:.03em;
    color:var(--cream);
    text-shadow:0 1px 2px rgba(0,0,0,0.7), 0 4px 22px rgba(0,0,0,0.55);
  }
  .line .en{
    display:block;
    margin-top:14px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    letter-spacing:.02em;
    color:var(--gold-soft);
    text-shadow:0 1px 2px rgba(0,0,0,0.65), 0 4px 18px rgba(0,0,0,0.5);
  }
  .line .accent{
    display:block; margin:18px auto 0; width:30px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.85;
  }

  /* ---------- footer ---------- */
  .footer{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    padding:0 22px calc(env(safe-area-inset-bottom,0px) + 26px);
    text-align:center;
  }
  .footer .rule{
    width:1px; height:22px; margin:0 auto 10px;
    background:linear-gradient(180deg, transparent, rgba(230,182,168,.75));
  }
  .footer .sign{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:13.5px; color:var(--cream-dim); letter-spacing:.05em;
  }
  .footer .sign svg{ width:11px; height:11px; opacity:.8; }

  .tap-zone{ position:absolute; inset:0; z-index:6; }

  @media (prefers-reduced-motion: reduce){
    .line{ animation-duration:.01ms !important; animation-iteration-count:1 !important; opacity:1 !important; filter:none !important; transform:none !important; }
    .mote{ animation:none; display:none; }
  }
</style>
</head>

  <div class="motes" id="motes"></div>

            <stop offset="0%" stop-color="#fff8e6"/>

            <stop offset="100%" stop-color="var(--gold)"/>
          </radialGradient>
        </defs>
        <path d="M12 2c.4 3.6 1 6 2.2 7.2C15.4 10.4 17.8 11 21.4 11.4c-3.6.4-6 1-7.2 2.2-1.2 1.2-1.8 3.6-2.2 7.2-.4-3.6-1-6-2.2-7.2C8.6 12.4 6.2 11.8 2.6 11.4c3.6-.4 6-1 7.2-2.2C11 8 11.6 5.6 12 2z"/>
      </svg>
    </span>
  </div>

  <div class="lines" id="lines"></div>

  <div class="footer">
    <div class="rule"></div>
    <div class="sign">
      <svg viewBox="0 0 24 24" fill="var(--gold-soft)" style="opacity:.85">
        <path d="M12 2c.4 3.6 1 6 2.2 7.2C15.4 10.4 17.8 11 21.4 11.4c-3.6.4-6 1-7.2 2.2-1.2 1.2-1.8 3.6-2.2 7.2-.4-3.6-1-6-2.2-7.2C8.6 12.4 6.2 11.8 2.6 11.4c3.6-.4 6-1 7.2-2.2C11 8 11.6 5.6 12 2z"/>
      </svg>
      Pastor's Prayer Over Me
    </div>
  </div>

  <div class="tap-zone" id="tapZone"></div>
</div>

<script>
(function(){
  var sentences = [
    { zh:"我會在妳的職場、<br>妳的關係裡保護妳，", en:"I will protect you —<br>in your work, and in your relationships." },
    { zh:"我不會讓妳受到任何委屈。", en:"I will never let you be wronged." },
    { zh:"妳要專心聆聽我的話語，", en:"Listen closely to My voice." },
    { zh:"不要聽別人的聲音，<br>不要聽自己的聲音。", en:"Not to the voices of others, not even to your own." },
    { zh:"每次妳打開聖經的時候，", en:"Every time you open My Word," },
    { zh:"我就要親自來，對妳說話。", en:"I Myself will come and speak to you." }
  ];

  var VISIBLE = 4400;   // how long each line stays fully readable (incl. fade)
  var OVERLAP = 1100;   // crossfade window shared between consecutive lines
  var SPACING = VISIBLE - OVERLAP;
  var N = sentences.length;
  var LOOP = SPACING * N;

  var inEndPct   = (OVERLAP / LOOP * 100).toFixed(3) + '%';
  var holdEndPct = ((VISIBLE - OVERLAP) / LOOP * 100).toFixed(3) + '%';
  var outEndPct  = (VISIBLE / LOOP * 100).toFixed(3) + '%';

  // Build the real @keyframes now that percentages are known (CSS custom
  // properties aren't allowed as keyframe selectors, so we inject the rule).
  var style = document.createElement('style');
  style.textContent =
    '@keyframes pulse{' +
    '0%{opacity:0;filter:blur(7px);transform:translateY(30px) scale(.98);}' +
    inEndPct+'{opacity:1;filter:blur(0);transform:translateY(0) scale(1);}' +
    holdEndPct+'{opacity:1;filter:blur(0);transform:translateY(0) scale(1);}' +
    outEndPct+'{opacity:0;filter:blur(6px);transform:translateY(-24px) scale(1.01);}' +
    '100%{opacity:0;}' +
    '}';
  document.head.appendChild(style);

  var linesEl = document.getElementById('lines');
  sentences.forEach(function(s, i){
    var d = document.createElement('div');
    d.className = 'line';
    d.style.animationDuration = LOOP + 'ms';
    d.style.animationDelay = (i * SPACING) + 'ms';
    d.innerHTML = '<span class="glow"></span><span class="zh">'+s.zh+'</span><span class="en">'+s.en+'</span><span class="accent"></span>';
    linesEl.appendChild(d);
  });

  var stage = document.getElementById('stage');
  var paused = false;
  document.getElementById('tapZone').addEventListener('click', function(){
    paused = !paused;
    stage.classList.toggle('paused', paused);
  });

  function spawnMotes(){
    var host = document.getElementById('motes');
    var n = 14;
    for(var i=0;i<n;i++){
      var m = document.createElement('div');
      m.className = 'mote';
      var size = 2 + Math.random()*3;
      m.style.width = size+'px';
      m.style.height = size+'px';
      m.style.left = (Math.random()*100)+'%';
      m.style.bottom = (-10 - Math.random()*20)+'%';
      m.style.setProperty('--dx', (Math.random()*40-20)+'px');
      m.style.animationDuration = (9 + Math.random()*10)+'s';
      m.style.animationDelay = (Math.random()*10)+'s';
      host.appendChild(m);
    }
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce) spawnMotes();
})();
</script>
</body>
</html>
